name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # This disposable hosted runner does not build mobile apps.
      - name: Remove the unused preinstalled Android SDK
        run: sudo rm -rf /usr/local/lib/android
      - name: Generate ephemeral local configuration
        run: python3 scripts/init-env.py
      - name: Build the portal and prepare its test dependencies
        run: |
          # All five application roles share the image built by manage.
          # Reclaim intermediate build cache on this disposable runner;
          # tagged runtime images remain available for the validation gate.
          for service in manage frontend db elasticsearch redis rabbitmq rdfdb nginx; do
            docker compose --profile tools --parallel 1 build "$service"
            docker builder prune --all --force
          done
          docker compose up -d --wait db elasticsearch redis rabbitmq rdfdb smtp flags
          docker compose run --rm manage python manage.py migrate --noinput
      - name: Run validation.commands
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.validation.commands[]' .ai/agentic.config.json | while IFS= read -r cmd; do
            echo "::group::$cmd"
            sh -c "$cmd" < /dev/null
            echo "::endgroup::"
          done
      - name: Stop the owned test stack
        if: always()
        run: docker compose down
