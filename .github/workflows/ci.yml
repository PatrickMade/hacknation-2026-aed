name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral local configuration
        run: python3 scripts/init-env.py
      - name: Build the portal and prepare its test dependencies
        run: |
          docker compose --profile tools build
          docker compose up -d --wait db elasticsearch redis rabbitmq rdfdb smtp flags
          docker compose run --rm manage python manage.py migrate --noinput
      - name: Run validation.commands
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.validation.commands[]' .ai/agentic.config.json | while IFS= read -r cmd; do
            echo "::group::$cmd"
            sh -c "$cmd" < /dev/null
            echo "::endgroup::"
          done
      - name: Stop the owned test stack
        if: always()
        run: docker compose down
