<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Mapa Serc - okładka projektu w HackTribe (800 x 600)</title>
<link rel="stylesheet" href="styl.css">
<style>
  html, body { width: 800px; height: 600px; overflow: hidden; }
  .ht {
    width: 800px; height: 600px; background: var(--jasna);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .ht img { width: 560px; }
  .ht p { margin: 0; }
  .ht .pod { font-size: 27px; font-weight: 700; line-height: 1.25; margin-top: 34px; max-width: 640px; }
  .ht .pasek {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--ciemna); color: var(--bialy);
    font-size: 18px; font-weight: 600; padding: 16px 24px;
  }
</style>
</head>
<body>
<div class="ht">
  <img src="../../brand/logo/mapa-serc-logo-haslo-kolor.svg" alt="Mapa Serc - Wszystkie AED pod ręką.">
  <p class="pod">Jeden standard danych o defibrylatorach AED<br>w&nbsp;portalu dane.gov.pl</p>
  <p class="pasek">HackNation 2026 · Misja AED - Dane na ratunek</p>
</div>
</body>
</html>
